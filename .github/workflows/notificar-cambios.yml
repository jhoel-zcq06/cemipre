name: Sincronización automática Drive y avisos

on:
  schedule:
    # Ejecución automática cada 5 minutos (compatible con Supabase Free Tier)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cemipre-drive-autosync
  cancel-in-progress: false

jobs:
  sync-y-notificar:
    name: Sincronizar carpetas Drive y notificar cambios
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar automáticamente carpetas y bitácoras (sync-drive)
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_FUNCTIONS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets SUPABASE_FUNCTIONS_URL o CRON_SECRET no configurados; omitiendo ejecución."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "${SUPABASE_FUNCTIONS_URL%/}/sync-drive" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"origen":"github-actions","auto":true}'

      - name: Consultar cambios y enviar avisos por correo (notificar-cambios)
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_FUNCTIONS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets SUPABASE_FUNCTIONS_URL o CRON_SECRET no configurados; omitiendo ejecución."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "${SUPABASE_FUNCTIONS_URL%/}/notificar-cambios" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"origen":"github-actions"}'
